name: Pages

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

# one deploy at a time; a newer push waits instead of cancelling a deploy half way
concurrency:
  group: pages
  cancel-in-progress: false

jobs:
  # render every case with the browser's OpenSCAD, the one people download from, and check it
  check:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        with:
          python-version: "3.13"
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: "24"
      # the versions in the flake's nixpkgs, so CI checks what nix develop checks
      - run: pip install trimesh==5.1.0 manifold3d==3.5.4 numpy==2.5.2 scipy==1.18.1 networkx==3.6.1 rtree==1.4.1
      - run: python3 tools/check_parts.py -e wasm

  deploy:
    needs: check
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/configure-pages@45bfe0192ca1faeb007ade9deae92b16b8254a0d # v6.0.0
      - name: Build the site
        # the page, plus the OpenSCAD sources at the paths the render worker fetches them from
        run: |
          mkdir _site
          cp -r web/static/. _site/
          cp -r opengrips.scad src _site/
      - uses: actions/upload-pages-artifact@fc324d3547104276b827a68afc52ff2a11cc49c9 # v5.0.0
        with:
          path: _site
      - id: deployment
        uses: actions/deploy-pages@368f82528645a54fb793d4d04e342629a3f51346 # v5.0.1
